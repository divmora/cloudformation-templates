AWSTemplateFormatVersion: '2010-09-09'
Description: >
  AWS Log to OpenTelemetry (OTLP) Processor deployed as a serverless container
  Lambda application triggered by S3/SQS access logs (ALB, NLB, CloudFront, WAF)
  with offline BSL 1.1 commercial license enforcement and OTel resource watermarking.

# ==============================================================================
# Metadata & Parameter Groups
# ==============================================================================
Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: "Application & Compute Configuration"
        Parameters:
          - EnvironmentName
          - ImageUri
          - Architecture
          - MemorySize
          - Timeout
          - LogLevel
          - LogRetentionInDays
      - Label:
          default: "OpenTelemetry Exporter Configuration"
        Parameters:
          - OtlpLogsEndpoint
          - BasicAuthUsername
          - BasicAuthPassword
          - BasicAuthPasswordSecretArn
          - MaxBatchSize
          - MaxRetries
          - MaxConcurrent
      - Label:
          default: "DIVMORA Commercial Licensing & Provenance"
        Parameters:
          - DivmoraLicenseKey
          - DivmoraLicenseKeySecretArn
          - DivmoraLicenseMode
          - DivmoraReleaseSignature
      - Label:
          default: "Log Source & Ingestion Queue"
        Parameters:
          - LogSourceBucketArns
          - AllowedSourceAccountIds
          - OrganizationId
          - LogSourceKmsKeyArns
          - SqsVisibilityTimeout
          - SqsBatchSize
          - SqsBatchingWindow
          - SqsMaximumConcurrency
          - SqsMaxReceiveCount
      - Label:
          default: "VPC Configuration (Optional)"
        Parameters:
          - VpcSubnetIds
          - VpcSecurityGroupIds

# ==============================================================================
# Parameters
# ==============================================================================
Parameters:
  EnvironmentName:
    Type: String
    Default: prod
    AllowedValues:
      - dev
      - staging
      - prod
    Description: Deployment stage or environment name (e.g. dev, staging, prod).

  ImageUri:
    Type: String
    Default: ghcr.io/divmora/otel-aws-log-processor:latest
    Description: >
      URI of the container image in Amazon ECR or GitHub Container Registry
      (e.g., 123456789012.dkr.ecr.us-east-1.amazonaws.com/otel-aws-log-processor:latest).

  Architecture:
    Type: String
    Default: arm64
    AllowedValues:
      - arm64
      - x86_64
    Description: >
      CPU instruction set architecture. 'arm64' (AWS Graviton) is recommended for best
      price-to-performance and throughput with official multi-arch images. If deploying
      a custom single-arch container image built on x86 CI runners, set this to 'x86_64'
      to prevent 'Runtime.InvalidEntrypoint' errors.

  MemorySize:
    Type: Number
    Default: 512
    MinValue: 128
    MaxValue: 10240
    Description: Memory allocated to Lambda function in MB (512MB recommended for log parsing).

  Timeout:
    Type: Number
    Default: 120
    MinValue: 10
    MaxValue: 900
    Description: Function execution timeout in seconds (must be <= SqsVisibilityTimeout).

  LogLevel:
    Type: String
    Default: info
    AllowedValues:
      - debug
      - info
      - warn
      - error
    Description: Log level severity for Lambda structured logging.

  LogRetentionInDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 180, 365]
    Description: Number of days to retain CloudWatch logs.

  OtlpLogsEndpoint:
    Type: String
    Default: "http://localhost:4318/v1/logs"
    Description: HTTP destination endpoint for exporting OpenTelemetry OTLP/HTTP log records.

  BasicAuthUsername:
    Type: String
    Default: ""
    Description: Optional HTTP Basic Authentication username for the OTLP collector.

  BasicAuthPassword:
    Type: String
    NoEcho: true
    Default: ""
    Description: >
      Optional direct HTTP Basic Authentication password. Leave blank if using BasicAuthPasswordSecretArn.

  BasicAuthPasswordSecretArn:
    Type: String
    Default: ""
    Description: >
      Optional AWS Secrets Manager secret ARN storing the OTLP basic auth password.

  MaxBatchSize:
    Type: Number
    Default: 500
    MinValue: 50
    MaxValue: 5000
    Description: Maximum number of OTel log records per outbound HTTP request.

  MaxRetries:
    Type: Number
    Default: 3
    MinValue: 0
    MaxValue: 10
    Description: Number of retry attempts on failed HTTP export requests.

  MaxConcurrent:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 50
    Description: Maximum number of concurrent log file parsers and HTTP sender routines.

  DivmoraLicenseKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: >
      DIVMORA commercial license token. Free for non-production environments (dev, staging, test).

  DivmoraLicenseKeySecretArn:
    Type: String
    Default: ""
    Description: Optional AWS Secrets Manager ARN storing the DIVMORA commercial license token.

  DivmoraLicenseMode:
    Type: String
    Default: warn
    AllowedValues:
      - warn
      - strict
    Description: >
      Enforcement mode: 'warn' logs compliance notices and emits CloudWatch EMF metrics without blocking;
      'strict' terminates processing if commercial license is missing or expired in production.

  DivmoraReleaseSignature:
    Type: String
    Default: ""
    Description: >
      Optional cryptographic release provenance attestation token for Layer 3 BSL 1.1 defense.

  LogSourceBucketArns:
    Type: CommaDelimitedList
    Default: "*"
    Description: >
      Comma-separated list of S3 bucket ARN patterns containing access logs to grant Lambda read access
      (e.g. 'arn:aws:s3:::app1-logs,arn:aws:s3:::app2-logs' or '*').

  AllowedSourceAccountIds:
    Type: CommaDelimitedList
    Default: ""
    Description: >
      Optional comma-separated list of external AWS Account IDs permitted to publish EventBridge
      log notifications to the SQS Ingestion Queue across accounts.

  OrganizationId:
    Type: String
    Default: ""
    Description: >
      Optional AWS Organization ID (e.g. 'o-abcdef1234'). When specified, permits ALL accounts
      within the AWS Organization to publish EventBridge log notifications to the SQS Ingestion Queue.

  LogSourceKmsKeyArns:
    Type: CommaDelimitedList
    Default: ""
    Description: >
      Optional comma-separated list of KMS Key ARNs used to encrypt S3 log buckets in external
      source accounts (grants kms:Decrypt to the Lambda execution role).

  SqsVisibilityTimeout:
    Type: Number
    Default: 180
    MinValue: 30
    MaxValue: 1200
    Description: Visibility timeout for SQS ingestion queue (must be greater than Lambda Timeout).

  SqsBatchSize:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 10
    Description: Max number of SQS records delivered to Lambda per invocation batch.

  SqsBatchingWindow:
    Type: Number
    Default: 5
    MinValue: 0
    MaxValue: 300
    Description: Maximum batching window in seconds to wait for log messages before triggering Lambda.

  SqsMaximumConcurrency:
    Type: Number
    Default: 10
    MinValue: 2
    MaxValue: 1000
    Description: Maximum concurrent Lambda invocations triggered by the SQS queue.

  SqsMaxReceiveCount:
    Type: Number
    Default: 3
    MinValue: 1
    MaxValue: 10
    Description: Number of retry attempts before moving unprocessable messages to the DLQ.

  VpcSubnetIds:
    Type: CommaDelimitedList
    Default: ""
    Description: Optional comma-separated list of VPC Subnet IDs for private collector connectivity.

  VpcSecurityGroupIds:
    Type: CommaDelimitedList
    Default: ""
    Description: Optional comma-separated list of Security Group IDs for Lambda VPC attachment.

# ==============================================================================
# Conditions
# ==============================================================================
Conditions:
  HasVpc: !Not [!Equals [!Join ["", !Ref VpcSubnetIds], ""]]
  HasBasicAuthSecret: !Not [!Equals [!Ref BasicAuthPasswordSecretArn, ""]]
  HasLicenseSecret: !Not [!Equals [!Ref DivmoraLicenseKeySecretArn, ""]]
  HasDirectBasicAuthPassword: !Not [!Equals [!Ref BasicAuthPassword, ""]]
  HasDirectLicenseKey: !Not [!Equals [!Ref DivmoraLicenseKey, ""]]
  HasAllowedSourceAccounts: !Not [!Equals [!Join ["", !Ref AllowedSourceAccountIds], ""]]
  HasOrganizationId: !Not [!Equals [!Ref OrganizationId, ""]]
  HasLogSourceKmsKeys: !Not [!Equals [!Join ["", !Ref LogSourceKmsKeyArns], ""]]
  HasWildcardBucket: !Equals [!Join ["", !Ref LogSourceBucketArns], "*"]

# ==============================================================================
# Resources
# ==============================================================================
Resources:

  # ----------------------------------------------------------------------------
  # SQS Dead Letter Queue (DLQ)
  # ----------------------------------------------------------------------------
  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub otel-aws-log-processor-dlq-${EnvironmentName}
      MessageRetentionPeriod: 1209600 # 14 days
      SqsManagedSseEnabled: true

  # ----------------------------------------------------------------------------
  # SQS Ingestion Queue (Receives S3 ObjectCreated Notifications)
  # ----------------------------------------------------------------------------
  IngestionQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub otel-aws-log-processor-queue-${EnvironmentName}
      VisibilityTimeout: !Ref SqsVisibilityTimeout
      MessageRetentionPeriod: 345600 # 4 days
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: !Ref SqsMaxReceiveCount

  # ----------------------------------------------------------------------------
  # SQS Queue Policy (Permits S3 & EventBridge Notification Ingress)
  # ----------------------------------------------------------------------------
  IngestionQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref IngestionQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowSameAccountS3AndEventBridgeSend
            Effect: Allow
            Principal:
              Service:
                - s3.amazonaws.com
                - events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt IngestionQueue.Arn
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
          - !If
            - HasAllowedSourceAccounts
            - Sid: AllowCrossAccountEventBridgeAccounts
              Effect: Allow
              Principal:
                Service: events.amazonaws.com
              Action: sqs:SendMessage
              Resource: !GetAtt IngestionQueue.Arn
              Condition:
                StringEquals:
                  aws:SourceAccount: !Ref AllowedSourceAccountIds
            - !Ref AWS::NoValue
          - !If
            - HasOrganizationId
            - Sid: AllowAllAccountsInOrganization
              Effect: Allow
              Principal:
                Service: events.amazonaws.com
              Action: sqs:SendMessage
              Resource: !GetAtt IngestionQueue.Arn
              Condition:
                StringEquals:
                  aws:PrincipalOrgID: !Ref OrganizationId
            - !Ref AWS::NoValue

  # ----------------------------------------------------------------------------
  # CloudWatch Log Group
  # ----------------------------------------------------------------------------
  LambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/otel-aws-log-processor-${EnvironmentName}
      RetentionInDays: !Ref LogRetentionInDays

  # ----------------------------------------------------------------------------
  # Lambda IAM Execution Role
  # ----------------------------------------------------------------------------
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub otel-aws-log-processor-role-${EnvironmentName}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !If
          - HasVpc
          - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
          - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SqsProcessorPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:GetQueueAttributes
                  - sqs:ChangeMessageVisibility
                Resource:
                  - !GetAtt IngestionQueue.Arn
        - PolicyName: S3LogBucketAccessPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource: !If
                  - HasWildcardBucket
                  - - "arn:aws:s3:::*"
                    - "arn:aws:s3:::*/*"
                  - !Ref LogSourceBucketArns
        - !If
          - HasLogSourceKmsKeys
          - PolicyName: KmsLogDecryptionPolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - kms:Decrypt
                    - kms:DescribeKey
                  Resource: !Ref LogSourceKmsKeyArns
          - !Ref AWS::NoValue
        - !If
          - HasBasicAuthSecret
          - PolicyName: BasicAuthSecretReadPolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref BasicAuthPasswordSecretArn
          - !Ref "AWS::NoValue"
        - !If
          - HasLicenseSecret
          - PolicyName: LicenseSecretReadPolicy
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: secretsmanager:GetSecretValue
                  Resource: !Ref DivmoraLicenseKeySecretArn
          - !Ref "AWS::NoValue"

  # ----------------------------------------------------------------------------
  # AWS Lambda Function (OCI Custom Container Runtime)
  # ----------------------------------------------------------------------------
  LambdaFunction:
    Type: AWS::Lambda::Function
    DependsOn: LambdaLogGroup
    Properties:
      FunctionName: !Sub otel-aws-log-processor-${EnvironmentName}
      Description: High-performance AWS access log processor converting raw logs to OpenTelemetry OTLP records
      Role: !GetAtt LambdaExecutionRole.Arn
      PackageType: Image
      Code:
        ImageUri: !Ref ImageUri
      Architectures:
        - !Ref Architecture
      MemorySize: !Ref MemorySize
      Timeout: !Ref Timeout
      Environment:
        Variables:
          ENVIRONMENT: !Ref EnvironmentName
          LOG_LEVEL: !Ref LogLevel
          OTLP_HTTP_LOGS_ENDPOINT: !Ref OtlpLogsEndpoint
          BASIC_AUTH_USERNAME: !Ref BasicAuthUsername
          BASIC_AUTH_PASSWORD: !If
            - HasBasicAuthSecret
            - !Sub "{{resolve:secretsmanager:${BasicAuthPasswordSecretArn}:SecretString}}"
            - !If [HasDirectBasicAuthPassword, !Ref BasicAuthPassword, ""]
          MAX_BATCH_SIZE: !Ref MaxBatchSize
          MAX_RETRIES: !Ref MaxRetries
          MAX_CONCURRENT: !Ref MaxConcurrent
          DIVMORA_LICENSE_KEY: !If
            - HasLicenseSecret
            - !Sub "{{resolve:secretsmanager:${DivmoraLicenseKeySecretArn}:SecretString}}"
            - !If [HasDirectLicenseKey, !Ref DivmoraLicenseKey, ""]
          DIVMORA_LICENSE_MODE: !Ref DivmoraLicenseMode
          DIVMORA_RELEASE_SIGNATURE: !Ref DivmoraReleaseSignature
      VpcConfig: !If
        - HasVpc
        - SubnetIds: !Ref VpcSubnetIds
          SecurityGroupIds: !Ref VpcSecurityGroupIds
        - !Ref "AWS::NoValue"

  # ----------------------------------------------------------------------------
  # Lambda SQS Event Source Mapping
  # ----------------------------------------------------------------------------
  LambdaEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      EventSourceArn: !GetAtt IngestionQueue.Arn
      FunctionName: !Ref LambdaFunction
      Enabled: true
      BatchSize: !Ref SqsBatchSize
      MaximumBatchingWindowInSeconds: !Ref SqsBatchingWindow
      ScalingConfig:
        MaximumConcurrency: !Ref SqsMaximumConcurrency
      FunctionResponseTypes:
        - ReportBatchItemFailures

  # ----------------------------------------------------------------------------
  # CloudWatch Alarm: DLQ Messages
  # ----------------------------------------------------------------------------
  DeadLetterQueueAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub otel-aws-log-processor-dlq-messages-${EnvironmentName}
      AlarmDescription: Triggers when unprocessed log messages accumulate in the DLQ
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt DeadLetterQueue.QueueName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold

  # ----------------------------------------------------------------------------
  # CloudWatch Alarm: Lambda Errors
  # ----------------------------------------------------------------------------
  LambdaErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub otel-aws-log-processor-errors-${EnvironmentName}
      AlarmDescription: Triggers when Lambda invocations produce unhandled errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref LambdaFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold

# ==============================================================================
# Outputs
# ==============================================================================
Outputs:
  LambdaFunctionArn:
    Description: ARN of the deployed log processor Lambda function
    Value: !GetAtt LambdaFunction.Arn
    Export:
      Name: !Sub ${AWS::StackName}-LambdaArn

  LambdaFunctionName:
    Description: Name of the deployed log processor Lambda function
    Value: !Ref LambdaFunction
    Export:
      Name: !Sub ${AWS::StackName}-LambdaName

  IngestionQueueArn:
    Description: ARN of the SQS ingestion queue (use in S3 Bucket Notification configurations)
    Value: !GetAtt IngestionQueue.Arn
    Export:
      Name: !Sub ${AWS::StackName}-IngestionQueueArn

  IngestionQueueUrl:
    Description: URL of the SQS ingestion queue
    Value: !Ref IngestionQueue
    Export:
      Name: !Sub ${AWS::StackName}-IngestionQueueUrl

  DeadLetterQueueArn:
    Description: ARN of the Dead Letter Queue
    Value: !GetAtt DeadLetterQueue.Arn
    Export:
      Name: !Sub ${AWS::StackName}-DeadLetterQueueArn

  DeadLetterQueueUrl:
    Description: URL of the Dead Letter Queue
    Value: !Ref DeadLetterQueue

  LambdaExecutionRoleArn:
    Description: ARN of the Lambda IAM Execution Role
    Value: !GetAtt LambdaExecutionRole.Arn
